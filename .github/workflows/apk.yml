name: Build Android app (APK)

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'App address without https:// (empty = variable REGO_HOST or the default)'
        required: false
  push:
    branches: [main]
    paths: ['android/**', 'public/**', '.github/workflows/apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.9

      - name: Determine version and address
        id: meta
        run: |
          echo "version=$(sed -n 's/^version: "\(.*\)"/\1/p' rego/config.yaml)" >> "$GITHUB_OUTPUT"
          HOST="${{ inputs.host }}"; [ -z "$HOST" ] && HOST="${{ vars.REGO_HOST }}"; [ -z "$HOST" ] && HOST="rego.tail2a5f03.ts.net"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: Check that older apps will be told about this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          LATEST="$(sed -n "s/^export const APP_LATEST = '\(.*\)';.*/\1/p" server/config.mjs)"
          if ! gh api "repos/${{ github.repository }}/releases/tags/app-v$VERSION" >/dev/null 2>&1 && [ "$LATEST" != "$VERSION" ]; then
            echo "::error::App version $VERSION is about to be published, but APP_LATEST in server/config.mjs is '$LATEST'. Set it to '$VERSION' so that older apps get the update hint (see BACKEND.md, Releasing)."
            exit 1
          fi
          echo "APP_LATEST: $LATEST (build $VERSION)" >> "$GITHUB_STEP_SUMMARY"

      - name: Provide Firebase configuration
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > android/app/google-services.json; echo "Firebase: yes (instant push)" >> "$GITHUB_STEP_SUMMARY"
          else echo "::warning::Secret GOOGLE_SERVICES_JSON_B64 is missing: app without instant push (polls about every 15 min)."; fi

      - name: Provide signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/rego-release.jks"
            echo "RG_KEYSTORE=$RUNNER_TEMP/rego-release.jks" >> "$GITHUB_ENV"
            echo "RG_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "signed=yes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No signing key stored (secret ANDROID_KEYSTORE_B64). The APK is built with the debug key, so it cannot be installed over a version signed with another key."
          fi

      - name: Build APK
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace \
            -PrgHost="${{ steps.meta.outputs.host }}" \
            -PrgVersionName="${{ steps.meta.outputs.version }}" \
            -PrgVersionCode="${{ github.run_number }}" 2>&1 | tee build.log \
          || { echo "::error::Gradle failed: $(grep -E 'error:|ERROR|FAILED|What went wrong|Caused by|Could not|build.gradle|Execution failed' -A2 build.log | head -n 40 | tr '\n' '|' | cut -c1-2500)"; exit 1; }

      - name: Name the file
        run: |
          cp android/app/build/outputs/apk/release/*.apk "rego-${{ steps.meta.outputs.version }}.apk"
          ls -la rego-*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: rego-apk
          path: rego-*.apk

      - name: Publish as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v${{ steps.meta.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "ReGo ${{ steps.meta.outputs.version }} (Android)" --notes "APK for installing on Android. Instructions: see the Install section of the README."
          gh release upload "$TAG" rego-*.apk --clobber
