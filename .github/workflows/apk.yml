name: Android-App (APK) bauen

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Adresse der App ohne https:// (leer = Variable REGO_HOST oder Standard)'
        required: false
  push:
    branches: [main]
    paths: ['android/**', 'public/**', '.github/workflows/apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Version und Adresse bestimmen
        id: meta
        run: |
          echo "version=$(sed -n 's/^version: "\(.*\)"/\1/p' rego/config.yaml)" >> "$GITHUB_OUTPUT"
          HOST="${{ inputs.host }}"; [ -z "$HOST" ] && HOST="${{ vars.REGO_HOST }}"; [ -z "$HOST" ] && HOST="rego.tail2a5f03.ts.net"
          echo "host=$HOST" >> "$GITHUB_OUTPUT"

      - name: Firebase-Konfiguration bereitstellen
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > android/app/google-services.json; echo "Firebase: ja (Sofort-Push)" >> "$GITHUB_STEP_SUMMARY"
          else echo "::warning::Geheimnis GOOGLE_SERVICES_JSON_B64 fehlt: App ohne Sofort-Push (Nachfrage alle ~15 Min.)."; fi

      - name: Signierschlüssel bereitstellen
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/rego-release.jks"
            echo "RG_KEYSTORE=$RUNNER_TEMP/rego-release.jks" >> "$GITHUB_ENV"
            echo "RG_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "signiert=ja" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Kein Signierschlüssel hinterlegt (Geheimnis ANDROID_KEYSTORE_B64). Die APK wird mit dem Debug-Schlüssel gebaut, dann zeigt Android eine Browserleiste und Updates lassen sich nicht über die alte Version installieren."
          fi

      - name: APK bauen
        run: |
          set -o pipefail
          gradle -p android assembleRelease --no-daemon --stacktrace \
            -PrgHost="${{ steps.meta.outputs.host }}" \
            -PrgVersionName="${{ steps.meta.outputs.version }}" \
            -PrgVersionCode="${{ github.run_number }}" 2>&1 | tee build.log \
          || { echo "::error::Gradle fehlgeschlagen: $(grep -E 'error:|ERROR|FAILED|What went wrong|Caused by|Could not|build.gradle|Execution failed' -A2 build.log | head -n 40 | tr '\n' '|' | cut -c1-2500)"; exit 1; }

      - name: Datei benennen
        run: |
          cp android/app/build/outputs/apk/release/*.apk "rego-${{ steps.meta.outputs.version }}.apk"
          ls -la rego-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rego-apk
          path: rego-*.apk

      - name: Als Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v${{ steps.meta.outputs.version }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "ReGo ${{ steps.meta.outputs.version }} (Android)" --notes "APK zum Installieren auf Android. Anleitung: deploy/ANDROID.md"
          gh release upload "$TAG" rego-*.apk --clobber
