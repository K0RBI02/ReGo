name: "ReGo"
version: "0.8.9"
slug: rego
description: "ReGo – minimalist public-transport app for commuters (Alpine region of Bavaria & Austria)"
url: "https://github.com/K0RBI02/ReGo"
image: "ghcr.io/k0rbi02/rego-addon-{arch}"
arch: [aarch64, amd64]
startup: application
boot: auto
init: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "ReGo web app and API (plain http, home network only)"
watchdog: "http://[HOST]:[PORT:8080]/api/health"
options:
  contact: ""
  invite_code: ""
  provider: "library"
  ts_mode: "off"
  ts_hostname: "rego"
  ts_authkey: ""
  fcm_key: ""
schema:
  contact: "str?"
  invite_code: "password?"
  provider: "list(library|transport-rest|mock)"
  ts_mode: "list(off|serve|funnel)"
  ts_hostname: "str?"
  ts_authkey: "password?"
  fcm_key: "password?"
