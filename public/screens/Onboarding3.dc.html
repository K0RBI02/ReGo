<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Start 3 von 3</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #2F6BFF;outline-offset:2px}
button,input{font-family:inherit}
button{cursor:pointer}
a,button{transition:transform .15s ease,background-color .2s ease,opacity .2s ease}
a:active,button:active{transform:scale(.97)}
@keyframes rg-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes rg-down{from{transform:translateY(-100%)}to{transform:none}}
@keyframes rg-up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
[role=status]{animation:rg-down .35s ease-out}
.rg-in{animation:rg-in .45s ease-out both}
.rg-toast{animation:rg-up .3s ease-out both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FDE3CF; color: #1C1A1A; font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; overflow-x: hidden; overflow-y: auto">

<nav aria-label="Fortschritt" style="display: flex; gap: 8px; padding: 22px 24px 0">
<a href="Onboarding1.dc.html" aria-label="Schritt 1 von 3" style="flex: 1; padding: 16px 0"><span style="display: block; height: 3px; background: rgba(28,26,26,0.22)"></span></a>
<a href="Onboarding2.dc.html" aria-label="Schritt 2 von 3" style="flex: 1; padding: 16px 0"><span style="display: block; height: 3px; background: rgba(28,26,26,0.22)"></span></a>
<a href="Onboarding3.dc.html" aria-label="Schritt 3 von 3" style="flex: 1; padding: 16px 0"><span style="display: block; height: 3px; background: #1C1A1A"></span></a>
</nav>

<h1 style="margin: 14px 24px 0; font-size: 60px; line-height: 0.95; font-weight: 700; letter-spacing: -0.05em">Nur was<br>zählt</h1>

<div class="rg-illu" style="flex: 1; min-height: 14px; overflow: hidden; display: grid; place-items: center">
<svg style="max-height: 100%; max-width: 100%" width="200" height="190" viewBox="0 0 200 190" fill="none" stroke="#1C1A1A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
<path d="M100 36c-25 0-40 19-40 44v28l-13 20h106l-13-20V80c0-25-15-44-40-44z" fill="#fff"></path><path d="M100 36c25 0 40 19 40 44v28l13 20h-53z" fill="#1C1A1A"></path>
<path d="M86 138c2 12 26 12 28 0"></path><path d="M100 36V24"></path><path d="M34 70c-9 12-9 26 0 38M166 70c9 12 9 26 0 38"></path><path d="M52 30l-9-9M148 30l9-9M100 14v-8"></path>
</svg>
</div>

<p style="margin: 0 24px; font-size: 18px; font-weight: 500; line-height: 1.35">Wir melden uns nur bei Störungen auf deinen Strecken. Du bestimmst, ab wann.</p>

<div style="margin: 14px 24px 0; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 700">Push ab Verspätung von</span>
<div style="display: flex; gap: 8px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="3">
<button type="button" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button>
</sc-for>
</div>
<span style="font-size: 14px; font-weight: 600; color: #4A4747; line-height: 1.3">Im Urlaub schaltest du Strecken im Menü einfach aus. Gleich fragt dein Handy nach Mitteilungen und Standort (nur für die nächste Strecke zuerst).</span>
</div>

<div style="padding: 20px 24px 32px; display: flex; align-items: center; gap: 16px">
<a href="#" onClick="{{go}}" aria-busy="{{busy}}" style="width: 180px; min-height: 64px; background: #1C1A1A; color: #fff; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 700">Los geht's</a>
<a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 600; line-height: 1.25; color: #3A3737">Später<br>einrichten</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { v: 5, busy: false }; }
  renderVals() {
    const options = [3, 5, 10].map((v) => ({
      label: v + ' Min.', on: this.state.v === v,
      style: 'flex: 1; min-height: 54px; border: 0; border-radius: 27px; font-size: 17px; font-weight: 700; ' + (this.state.v === v ? 'background: #1C1A1A; color: #fff' : 'background: #fff; color: #1C1A1A'),
      pick: () => this.setState({ v })
    }));
    return {
      options, busy: this.state.busy,
      go: async () => {
        if (this.state.busy) return;
        this.setState({ busy: true });
        const R = window.REGO;
        try { await R.actions.setThreshold(this.state.v); } catch (e) {}
        try { await R.requestPosition(); } catch (e) {}      // Standort-Dialog
        try { await R.actions.enablePush(); } catch (e) {}   // Mitteilungs-Dialog
        R.navigate('/Main');
      }
    };
  }
}
</script>
</body>
</html>
