<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ReGo Status</title>
<style>
:root{color-scheme:light dark;--bg:#F7F7F7;--fg:#1C1A1A;--card:#fff;--mut:#5E5B58;--ok:#2E7D32;--bad:#B3261E}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#F1F0EC;--card:#1F1E1C;--mut:#A9A6A0;--ok:#7FD085;--bad:#F2928B}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:34px;letter-spacing:-.03em}
.card{background:var(--card);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;gap:12px}
.row span:first-child{color:var(--mut);white-space:nowrap}
.row span:last-child{text-align:right}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}
small{color:var(--mut)}
</style>
</head>
<body>
<main>
  <h1>ReGo Status</h1>
  <div class="card" id="info"><span>Lädt …</span></div>
  <div class="card"><strong>Quellen</strong><div id="src"><small>Lädt …</small></div></div>
  <small>Nur Zahlen, keine persönlichen Daten.</small>
</main>
<script>
fetch('/api/status').then(function (r) { return r.json(); }).then(function (s) {
  var row = function (a, b) { return '<div class="row"><span>' + a + '</span><span>' + b + '</span></div>'; };
  document.getElementById('info').innerHTML = row('Version', s.version) + row('Datenquelle', s.provider) + row('Läuft seit', s.uptimeMin + ' Min.') + row('Geräte', s.devices) + row('Push-Abos', s.pushSubscriptions + (s.pushSubscriptions ? ' (' + s.pushWithToken + ' mit Firebase-Kennung)' : '')) + row('Sofort-Push', s.instantPush ? '<span class="ok">an</span>' : '<small>aus, Nachfrage alle ~15 Min.</small>');
  document.getElementById('src').innerHTML = s.sources.length ? s.sources.map(function (q) { return row(q.name, q.ok === null ? '<small>unbekannt</small>' : q.ok ? '<span class="ok">erreichbar</span>' : '<span class="bad">pausiert</span>'); }).join('') : '<small>Keine Quellen (Demo-Modus)</small>';
}).catch(function () { document.getElementById('info').textContent = 'Status nicht abrufbar.'; });
</script>
</body>
</html>
