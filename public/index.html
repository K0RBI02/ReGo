<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>ReGo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F7">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preload" href="/fonts/InstrumentSans-Regular.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/fonts/InstrumentSans-Bold.ttf" as="font" type="font/ttf" crossorigin>
<style>
/* Font: Instrument Sans (SIL Open Font License, the license text is in /fonts/), shipped with the app instead of being loaded from a third party.
   There are two weights: 400/500 uses Regular, 600 to 800 uses Bold. If the file is missing, the system font takes over. */
@font-face{font-family:'Instrument Sans';src:url('/fonts/InstrumentSans-Regular.ttf') format('truetype');font-weight:400 500;font-style:normal;font-display:swap}
@font-face{font-family:'Instrument Sans';src:url('/fonts/InstrumentSans-Bold.ttf') format('truetype');font-weight:600 800;font-style:normal;font-display:swap}
html,body{margin:0;height:100%;background:#F7F7F7;-webkit-text-size-adjust:100%}
@media (prefers-color-scheme: dark){html,body{background:#121212}}
#app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;overflow:hidden}
#screen{height:100%}
#screen>div{width:100% !important;height:100% !important;max-width:none !important;position:relative !important;padding-top:env(safe-area-inset-top)}
/* Floating buttons: only the buttons lie over the content, the strip behind them is transparent */
.rg-dock{position:absolute !important;left:0;right:0;bottom:0;background:transparent !important;pointer-events:none;z-index:5;padding-bottom:calc(28px + env(safe-area-inset-bottom)) !important}
.rg-dock > *,.rg-dock a,.rg-dock button{pointer-events:auto}
.rg-top{position:relative;z-index:5;flex:none;pointer-events:none;background:transparent !important}
.rg-top a,.rg-top button{pointer-events:auto}
.rg-under{margin-top:-68px;padding-top:76px !important}
.rg-dockpad{padding-bottom:calc(120px + env(safe-area-inset-bottom)) !important}
/* When scrolling, the content fades out softly at the top instead of being cut off hard under the header */
.rg-dockpad.rg-scrolled,.rg-fade.rg-scrolled{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 18px);mask-image:linear-gradient(to bottom,transparent 0,#000 18px)}
.rg-under.rg-scrolled{-webkit-mask-image:linear-gradient(to bottom,transparent 0,transparent 44px,#000 80px);mask-image:linear-gradient(to bottom,transparent 0,transparent 44px,#000 80px)}
/* Illustrations give way when space is short (small phones) instead of sliding over the text */
.rg-code{background:#fff !important;border-radius:10px;padding:8px;box-sizing:border-box}
.rg-illu{container-type:size}
@container (max-height:120px){.rg-illu svg{display:none}}
@supports (text-box:trim-both cap alphabetic){.rg-beta{margin-top:0 !important}}
/* Invitation code gate (no inline style, so that the dark-mode rules of the pages do not recolor it) */
.rg-gate{position:absolute;inset:0;z-index:55;background:#D4EDF6;color:#1C1A1A;font-family:'Instrument Sans','Helvetica Neue',Arial,sans-serif;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom));box-sizing:border-box;overflow-y:auto}
.rg-gate-main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px}
.rg-gate h1{margin:0;font-size:52px;line-height:.98;font-weight:700;letter-spacing:-0.04em}
.rg-gate p{margin:0;font-size:19px;font-weight:600;line-height:1.35}
.rg-gate input{min-height:60px;width:100%;box-sizing:border-box;border:1.5px solid #1C1A1A;border-radius:30px;padding:0 22px;font-size:20px;font-weight:700;font-family:inherit;background:#fff;color:#1C1A1A}
.rg-gate input:focus{box-shadow:0 0 0 3px #2F6BFF}
.rg-gate-err{min-height:22px;font-size:16px;font-weight:700;line-height:1.3}
.rg-gate button{flex:none;min-height:64px;border:0;border-radius:999px;background:#1C1A1A;color:#fff;font-size:19px;font-weight:700;font-family:inherit;cursor:pointer}
/* Commute-time slider: two handles on one track. There are two sliders on top of each other; their own handles are invisible and only catch taps,
   the round knobs next to them are what is drawn. Each slider only reacts up to the middle between the handles (clip-path), so the right one is grabbed even when
   the handles are close together. */
.rg-dual{position:relative;height:52px}
.rg-dual.rg-c{height:44px}
.rg-trk,.rg-fill{position:absolute;top:calc(50% - 3px);height:6px;border-radius:3px}
.rg-trk{left:18px;right:18px;background:rgba(28,26,26,.16)}
.rg-fill{background:#1C1A1A}
.rg-r{position:absolute;left:0;top:0;width:100%;height:100%;margin:0;padding:0;background:transparent;-webkit-appearance:none;appearance:none;pointer-events:none;touch-action:pan-y;outline:none}
.rg-r::-webkit-slider-runnable-track{-webkit-appearance:none;height:52px;background:transparent;border:0}
.rg-c .rg-r::-webkit-slider-runnable-track{height:44px}
.rg-r::-moz-range-track{height:100%;background:transparent;border:0}
.rg-r::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;box-sizing:border-box;width:36px;height:44px;margin-top:4px;border:0;border-radius:0;background:transparent}
.rg-c .rg-r::-webkit-slider-thumb{height:36px}
.rg-r::-moz-range-thumb{pointer-events:auto;box-sizing:border-box;width:36px;height:44px;border:0;border-radius:0;background:transparent}
.rg-c .rg-r::-moz-range-thumb{height:36px}
.rg-knob{position:absolute;top:calc(50% - 14px);width:28px;height:28px;margin-left:-14px;box-sizing:border-box;border-radius:50%;background:#1C1A1A;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);pointer-events:none}
.rg-r:focus-visible + .rg-knob{outline:3px solid #2F6BFF;outline-offset:2px}
input:focus{outline:none}
label:focus-within{box-shadow:0 0 0 3px #2F6BFF}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid #2F6BFF;outline-offset:2px}
</style>
<style id="screen-style"></style>
</head>
<body>
<div id="app"><div id="screen"></div><div id="splash" role="status" style="position:fixed;inset:0;max-width:520px;margin:0 auto;z-index:60;background:#EAF6CF;color:#1C1A1A;font-family:'Instrument Sans','Helvetica Neue',Arial,sans-serif;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;transition:opacity .35s ease;cursor:pointer"><svg width="420" height="420" viewBox="0 0 64 64" fill="none" style="position:absolute;left:-78px;top:30px;opacity:.3;pointer-events:none;transform:rotate(10deg)" stroke="#1C1A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M27 17l-5-8M37 17l5-8M18 34l-8-4M18 42l-9 2M19 50l-7 6M46 34l8-4M46 42l9 2M45 50l7 6"></path><ellipse cx="32" cy="38" rx="14" ry="17" fill="#fff"></ellipse><path d="M22 25a10 9 0 0 1 20 0z" fill="#1C1A1A"></path><path d="M32 26v29"></path><circle cx="24.5" cy="38" r="2" fill="#1C1A1A" stroke="none"></circle><circle cx="39.5" cy="38" r="2" fill="#1C1A1A" stroke="none"></circle><circle cx="26" cy="48" r="1.6" fill="#1C1A1A" stroke="none"></circle><circle cx="38" cy="48" r="1.6" fill="#1C1A1A" stroke="none"></circle></svg><svg width="420" height="420" viewBox="0 0 64 64" fill="none" style="position:absolute;left:148px;top:635px;opacity:.3;pointer-events:none;transform:rotate(10deg)" stroke="#1C1A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M27 17l-5-8M37 17l5-8M18 34l-8-4M18 42l-9 2M19 50l-7 6M46 34l8-4M46 42l9 2M45 50l7 6"></path><ellipse cx="32" cy="38" rx="14" ry="17" fill="#fff"></ellipse><path d="M22 25a10 9 0 0 1 20 0z" fill="#1C1A1A"></path><path d="M32 26v29"></path><circle cx="24.5" cy="38" r="2" fill="#1C1A1A" stroke="none"></circle><circle cx="39.5" cy="38" r="2" fill="#1C1A1A" stroke="none"></circle><circle cx="26" cy="48" r="1.6" fill="#1C1A1A" stroke="none"></circle><circle cx="38" cy="48" r="1.6" fill="#1C1A1A" stroke="none"></circle></svg><div style="position:relative;display:flex;align-items:flex-start;gap:14px;top:40px"><div style="font-size:84px;line-height:.9;font-weight:700;letter-spacing:-0.06em;text-box:trim-both cap alphabetic">ReGo</div><div id="splash-ver" class="rg-beta" style="background:#1C1A1A;color:#fff;border-radius:15px;padding:8px 18px;font-size:20px;font-weight:700;margin-top:9px">Beta</div></div><p style="position:relative;top:40px;margin:0;font-size:20px;font-weight:600;line-height:1.3;max-width:300px">Du testest eine frühe Version. Wenn etwas hakt, sag uns Bescheid, das hilft.</p></div></div>
<script>try{if(localStorage.getItem('rego.splashSeen')==='1'){var sp=document.getElementById('splash');if(sp)sp.remove();}}catch(e){}</script>
<noscript>ReGo braucht JavaScript.</noscript>

</body>
</html>
